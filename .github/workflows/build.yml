name: Build cs2external

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # lets you trigger a build manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive  # pulls ImGui if you add it as a submodule

      - name: Add MSVC to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake (MSVC + Ninja)
        shell: cmd
        run: |
          cmake -S . -B build ^
            -G "Ninja" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_CXX_COMPILER=cl ^
            -DCMAKE_SYSTEM_NAME=Windows

      - name: Build
        shell: cmd
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cs2external
          path: build/cs2external.exe
          retention-days: 30
