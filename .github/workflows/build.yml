name: Build cs2external

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure and Build (MSVC dev shell)
        uses: ilammy/msvc-dev-cmd@v1  # activates vcvars64 — cl.exe is now on PATH

      - name: Configure CMake
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cs2external
          path: build/cs2external.exe
          retention-days: 30
